<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imposta Password — Saba Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #f5f0eb;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: #fff;
  border-radius: 16px;
  padding: 48px 40px;
  width: 380px;
  max-width: 90vw;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}
.card h1 {
  font-size: 24px;
  font-weight: 700;
  color: #3e2723;
  text-align: center;
  margin-bottom: 8px;
}
.card p.sub {
  font-size: 14px;
  color: #795548;
  text-align: center;
  margin-bottom: 28px;
}
.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #5d4037;
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  padding: 10px 14px;
  border: 1.5px solid #d7ccc8;
  border-radius: 10px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
.form-group input:focus {
  border-color: #795548;
}
.btn {
  width: 100%;
  padding: 12px;
  background: #795548;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: background .2s;
  margin-top: 6px;
}
.btn:hover { background: #5d4037; }
.alert {
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 18px;
  line-height: 1.4;
}
.alert-error { background: #fbe9e7; color: #bf360c; }
.alert-success { background: #e8f5e9; color: #2e7d32; }
</style>
</head>
<body>

<div class="card">
  <h1>Imposta Password</h1>
  <p class="sub">Scegli una nuova password (min. 6 caratteri)</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="form-group">
      <label for="password">Nuova password</label>
      <input type="password" id="password" name="password" required minlength="6" autofocus>
    </div>
    <div class="form-group">
      <label for="password2">Conferma password</label>
      <input type="password" id="password2" name="password2" required minlength="6">
    </div>
    <button type="submit" class="btn">Salva</button>
  </form>
</div>

</body>
</html>
